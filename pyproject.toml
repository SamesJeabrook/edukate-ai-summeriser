[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edukate-progress-summariser"
version = "0.1.0"
description = "Evidence-based cohort progress summaries and escalation alerts"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0.0",
]

[project.scripts]
edukate-progress-summariser = "edukate_progress_summariser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
